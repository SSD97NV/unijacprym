name: Verify computational supplement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v6

      - name: Install Singular
        run: |
          sudo apt-get update
          sudo apt-get install --yes singular
          Singular --version

      - name: Build and audit the Lean library
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          axiom-audit: true
          axiom-audit-root: PrymLean
          axiom-audit-allow: propext,Classical.choice,Quot.sound

      - name: Run the complete local verification procedure
        run: sh verify.sh

      - name: Confirm that verification preserved tracked files
        run: git diff --exit-code

      - name: Upload the frozen verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            verification/AXIOM_REPORT.txt
            verification/SINGULAR_REPORT.txt
          if-no-files-found: error
          retention-days: 30
